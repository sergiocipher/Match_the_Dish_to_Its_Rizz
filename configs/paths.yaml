# paths.yaml – Path resolution for local vs Kaggle environments.
#
# src/config.py reads this at startup and overrides data_dir / out_dir
# depending on whether ON_KAGGLE is True.  Do NOT hardcode absolute paths
# anywhere else in the codebase; always use cfg["paths"]["data_dir"] etc.
#
# To change the competition slug (e.g. if the Kaggle slug differs), set the
# COMPETITION_SLUG environment variable before launching the notebook.

competition_slug: "match-the-dish-to-its-rizz"

# Local paths (relative to the project root; resolved to absolute in config.py)
local:
  data_dir: "data"
  out_dir: "artifacts"

# Kaggle paths (automatically used when /kaggle/input exists)
kaggle:
  data_dir: "/kaggle/input/competitions/match-the-dish-to-its-rizz"
  out_dir: "/kaggle/working"
  src_dataset: "/kaggle/input/datasets/somyajitsaha/food-retrieval-src"

# Sub-directories under out_dir (created by ensure_dirs)
subdirs:
  features: "features"
  checkpoints: "checkpoints"
  submissions: "submissions"
  oof_preds: "oof_preds"
  figures: "reports/figures"
